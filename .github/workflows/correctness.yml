name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-cad
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git clone -q --depth 1 https://github.com/dymokomi/luce-base.git
          python3 luce-base/tools/checkout_main.py luce-cad
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build the compilers
        run: |
          (cd luce-base && ./build.sh)
          (cd luce && LUCE_BASE_COMPILER=../luce-base/build/luce-base ./build.sh)
      - name: Native and C tests
        working-directory: luce-cad
        run: ./test.sh --opt 2
